name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            args: --target x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-x86_64' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Inject environment variables into config
        run: node scripts/inject-env.cjs
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# Unified Audio Engine Plugin
        run: dotnet publish plugin/src-engine/SymvoniaEngine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o plugin/src-engine/publish

      - name: Build C# AI Lyrics Plugin
        run: dotnet publish plugin/src-ai-lyrics/AiLyricsPlugin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o plugin/src-ai-lyrics/publish

      - name: Build Standalone Wallpaper Engine Plugin
        run: cmd /c build-plugin-wallpaper.bat

      - name: Calculate and export plugin SHA-256 hashes
        shell: pwsh
        run: |
          $audioPath = "plugin/src-engine/publish/symvonia-audio-engine.exe"
          $aiPath = "plugin/src-ai-lyrics/publish/symvonia-ai-lyrics.exe"
          $wallpaperPath = "plugin/src-wallpaper-engine/publish/symvonia-wallpaper-engine.exe"
          $audioHash = (Get-FileHash -LiteralPath $audioPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $aiHash = (Get-FileHash -LiteralPath $aiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $wallpaperHash = (Get-FileHash -LiteralPath $wallpaperPath -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($hash in @($audioHash, $aiHash, $wallpaperHash)) {
            if ($hash -notmatch '^[0-9a-f]{64}$') {
              throw "Invalid SHA-256 value generated for a plugin artifact."
            }
          }
          "SYMVONIA_AUDIO_PLUGIN_SHA256=$audioHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SYMVONIA_AI_PLUGIN_SHA256=$aiHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SYMVONIA_WALLPAPER_PLUGIN_SHA256=$wallpaperHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SYMVONIA_PLUGIN_RELEASE_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $checksumPath = Join-Path $env:RUNNER_TEMP "plugin-sha256sums.txt"
          @(
            "$audioHash  symvonia-audio-engine.exe"
            "$aiHash  symvonia-ai-lyrics.exe"
            "$wallpaperHash  symvonia-wallpaper-engine.exe"
          ) | Set-Content -Path $checksumPath -Encoding ascii
          "SYMVONIA_PLUGIN_CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build & Sign with tauri-action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Symvonia ${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download the installer for your platform.

            ## What's Changed
            * See commits since the previous release.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Hapus file .sig dan .zip dari release draft
        if: success()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --json assets -q '.assets[].name' | ForEach-Object {
            if ($_ -match '\.(sig|zip)$') {
              Write-Host "Menghapus: $_"
              gh release delete-asset $tag $_ --yes
            }
          }

      - name: Upload Plugins ke Release
        if: success()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release upload $tag "plugin/src-engine/publish/symvonia-audio-engine.exe" --clobber
          gh release upload $tag "plugin/src-ai-lyrics/publish/symvonia-ai-lyrics.exe" --clobber
          gh release upload $tag "plugin/src-wallpaper-engine/publish/symvonia-wallpaper-engine.exe" --clobber
          gh release upload $tag "$env:SYMVONIA_PLUGIN_CHECKSUM_PATH" --clobber
