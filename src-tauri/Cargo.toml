[package]
name = "symvonia"
version = "1.0.6"
description = "Symvonia - Desktop Music Player"
authors = ["Eszuri"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "symvonia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
lofty = "0.22"
id3 = "1.1"
base64 = "0.22"
image = "0.25"
rayon = "1.10"
symphonia = { version = "0.5", features = ["mp3", "flac", "pcm", "aac", "vorbis", "ogg", "wav", "aiff", "isomp4"] }
cpal = "0.15"
ringbuf = "0.3"
crossbeam-channel = "0.5"
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"
notify = "6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Foundation",
    "implement",
] }
windows-core = "0.58"
rfd = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
